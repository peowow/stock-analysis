<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stock Analysis</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --text: #f8fafc;
    --text-muted: #94a3b8; --border: #334155; --primary: #38bdf8; --primary-hover: #0284c7;
    --green: #4ade80; --red: #f87171; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --text: #0f172a;
      --text-muted: #64748b; --border: #cbd5e1; --primary: #0284c7; --primary-hover: #0369a1;
      --green: #16a34a; --red: #dc2626;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); padding: 12px; font-size: 14px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 18px; font-weight: 700; }
  button, .btn {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500;
  }
  button.primary { background: var(--primary); color: #fff; border: none; }
  button:hover { opacity: 0.9; }
  input, select, textarea {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: var(--radius); font-size: 13px;
  }
  .banner { padding: 8px 12px; border-radius: var(--radius); font-size: 12px; margin-bottom: 10px; display: none; }
  .banner.warn { background: rgba(248,113,113,0.15); border: 1px solid var(--red); color: var(--red); display: block; }
  .banner.info { background: rgba(56,189,248,0.15); border: 1px solid var(--primary); color: var(--primary); display: block; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .table-container { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; text-align: right; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { background: var(--surface2); font-weight: 600; cursor: pointer; user-select: none; }
  th:hover { color: var(--primary); }
  td.pinned, th.pinned { position: sticky; left: 0; background: var(--surface); z-index: 2; text-align: left; }
  th.pinned { background: var(--surface2); z-index: 3; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; place-items: center; z-index: 100; padding: 12px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 650px; max-height: 85vh; overflow-y: auto; padding: 16px; }
  .modal h2 { margin-bottom: 12px; font-size: 16px; }
  .setup-box { margin-top: 24px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 13px; }
  .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  footer { margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 11px; padding: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Stock Analysis</h1>
    <div id="update-status" style="font-size: 11px; color: var(--text-muted);">Loading data...</div>
  </div>
  <div style="display:flex; gap:6px;">
    <button id="btn-refresh" class="primary" onclick="triggerRefresh()">↻ Refresh Now</button>
    <button onclick="openModal('modal-columns')">Columns</button>
    <button onclick="openModal('modal-add-ticker')">+ Ticker</button>
    <button onclick="openModal('modal-formula')">+ Formula</button>
  </div>
</header>

<div id="banner-area"></div>

<div class="toolbar">
  <input type="text" id="search-box" placeholder="Search symbol..." oninput="renderTable()">
  <select id="group-filter" onchange="renderTable()"><option value="All">All Groups</option></select>
  <select id="preset-selector" onchange="applyPreset(this.value)"><option value="">Presets...</option></select>
  <button onclick="exportCSV()">Export CSV</button>
</div>

<div class="table-container">
  <table id="main-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div class="modal-overlay" id="modal-columns" onclick="if(event.target===this)closeModal('modal-columns')">
  <div class="modal">
    <h2>Select Columns & Metrics</h2>
    <input type="text" id="field-search" placeholder="Search fields..." oninput="renderFieldPicker()" style="width:100%; margin-bottom: 10px;">
    <div id="field-picker-list" style="max-height: 50vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
    <div style="margin-top:12px; display:flex; justify-content:flex-end; gap:8px;">
      <button onclick="closeModal('modal-columns')">Close</button>
      <button class="primary" onclick="saveColumns()">Save to Repo</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-add-ticker" onclick="if(event.target===this)closeModal('modal-add-ticker')">
  <div class="modal">
    <h2>Add Ticker</h2>
    <input type="text" id="new-ticker-input" placeholder="e.g. AAPL or SU.TO" style="width:100%; margin-bottom: 10px; text-transform:uppercase;">
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button onclick="closeModal('modal-add-ticker')">Cancel</button>
      <button class="primary" onclick="addTicker()">Add & Fetch</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-formula" onclick="if(event.target===this)closeModal('modal-formula')">
  <div class="modal">
    <h2>Add Custom Formula</h2>
    <input type="text" id="formula-name" placeholder="Column Name (e.g. Upside %)" style="width:100%; margin-bottom:8px;">
    <input type="text" id="formula-expr" placeholder="e.g. (targetMeanPrice - currentPrice) / currentPrice * 100" style="width:100%; margin-bottom:8px;" oninput="previewFormula()">
    <div id="formula-preview" style="font-size:12px; color:var(--text-muted); margin-bottom:12px; min-height:18px;"></div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button onclick="closeModal('modal-formula')">Cancel</button>
      <button class="primary" onclick="saveFormula()">Save Formula</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-detail" onclick="if(event.target===this)closeModal('modal-detail')">
  <div class="modal" style="max-width:750px;">
    <h2 id="detail-title">Ticker Detail</h2>
    <p id="detail-summary" style="font-size:12px; color:var(--text-muted); margin-bottom:12px; line-height:1.4;"></p>
    <div id="detail-chart" style="width:100%; height:160px; margin-bottom:12px; background:var(--surface2); border-radius:var(--radius); display:grid; place-items:center;"></div>
    <div id="detail-fields" style="max-height:45vh; overflow-y:auto;"></div>
    <div style="margin-top:12px; text-align:right;">
      <button onclick="closeModal('modal-detail')">Close</button>
    </div>
  </div>
</div>

<details class="setup-box">
  <summary style="cursor:pointer; font-weight:600;">GitHub Token & Setup (One-Time Per Device)</summary>
  <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
    <p style="font-size:12px; color:var(--text-muted);">Personal access token (fine-grained, Contents: Read/Write, Actions: Read/Write). Saved only in this browser's localStorage.</p>
    <input type="text" id="github-repo" placeholder="owner/repo-name (e.g. myname/stock-analysis)">
    <input type="password" id="github-token" placeholder="github_pat_...">
    <div style="display:flex; gap:8px;">
      <button class="primary" onclick="saveGitHubConfig()">Save Token</button>
      <button onclick="clearGitHubConfig()">Clear</button>
    </div>
